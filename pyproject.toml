[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "genome-mcp"
version = "0.1.0"
description = "Ask your genome: an MCP server that lets AI agents query and interpret VCF files"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Noella John" }]
dependencies = ["mcp>=1.10,<2", "httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
genome-mcp = "genome_mcp.cli:main"

[tool.setuptools.packages.find]
include = ["genome_mcp*"]

[tool.setuptools.package-data]
genome_mcp = ["data/*.tsv", "data/*.vcf", "data/*.md"]
